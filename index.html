<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111316">
  <meta name="description" content="10月30日的视频记录。点击播放，观看完整视频。">
  <title>10月30日 · 视频记录</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111316'/%3E%3Cpath d='M25 18v28l23-14z' fill='%23d8e8ce'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:dark;--bg:#111316;--text:#f3f3ee;--muted:#a6aba8;--accent:#d8e8ce}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% -15%,#28312c 0,transparent 55%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
    main{width:min(1080px,100%);margin:auto;padding:58px 32px 36px}.eyebrow{display:flex;align-items:center;gap:9px;color:var(--accent);font-size:12px;letter-spacing:.16em}.dot{width:6px;height:6px;background:var(--accent);border-radius:50%}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:20px 0 27px}h1{font-size:clamp(30px,5vw,44px);letter-spacing:.025em;line-height:1.2;margin:0;font-weight:600}.subtitle{font-size:14px;color:var(--muted);margin:12px 0 0;line-height:1.8}.duration{font-variant-numeric:tabular-nums;color:#bdc5bd;font-size:13px;letter-spacing:.08em;padding:8px 11px;border:1px solid #ffffff20;border-radius:6px;white-space:nowrap}
    .player{position:relative;isolation:isolate;overflow:hidden;border-radius:15px;aspect-ratio:16/9;background:#000;box-shadow:0 18px 70px #0004;border:1px solid #ffffff16}video{display:block;width:100%;height:100%;object-fit:contain;background:#000}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(0deg,#0005,#0001);border:0;color:white;cursor:pointer;font:inherit;text-shadow:0 1px 12px #000}.play-circle{display:grid;place-items:center;width:76px;height:76px;border-radius:50%;border:1px solid #ffffff80;background:#1b241a88;backdrop-filter:blur(10px);transition:transform .2s,background .2s}.overlay:hover .play-circle{transform:scale(1.06);background:#33432dcc}.overlay svg{width:26px;height:26px;margin-left:4px;fill:currentColor}.overlay-label{font-size:14px;letter-spacing:.08em}.overlay[hidden]{display:none}.bar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-top:19px;color:var(--muted);font-size:13px}.action{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px solid #ffffff23;border-radius:7px;padding:10px 13px;color:var(--text);font:inherit;cursor:pointer}.action:hover{background:#ffffff0b}.action svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.notice{font-size:13px;line-height:1.8;color:#f0cdb5;padding:15px 0}.notice[hidden]{display:none}a{color:var(--accent)}footer{margin-top:50px;border-top:1px solid #ffffff12;padding-top:20px;color:#808983;font-size:12px;letter-spacing:.08em}
    @media(max-width:600px){main{padding:35px 17px 25px}.heading{margin:20px 0 23px;gap:12px}.duration{font-size:12px}.player{border-radius:10px}.play-circle{width:59px;height:59px}.overlay{gap:10px}.overlay-label{font-size:12px}.bar{font-size:12px;gap:10px}.subtitle{font-size:13px}footer{margin-top:40px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow"><span class="dot" aria-hidden="true"></span>视频记录</div>
      <div class="heading">
        <div><h1>10月30日</h1><p class="subtitle">点击播放，观看完整视频。</p></div>
        <span class="duration" aria-label="时长1分31秒">01:31</span>
      </div>
    </header>
    <section aria-label="视频播放器">
      <div class="player" id="player">
        <video id="video" controls playsinline preload="metadata" poster="poster.jpg" aria-label="10月30日视频">
          <source src="video-720p.mp4" type="video/mp4">
          你的浏览器不支持视频播放。<a href="video-720p.mp4">打开视频文件</a>
        </video>
        <button type="button" class="overlay" id="play" aria-label="播放视频" hidden>
          <span class="play-circle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.8c0-.8.9-1.3 1.6-.9l14 8.2a1 1 0 0 1 0 1.8l-14 8.2c-.7.4-1.6-.1-1.6-.9z"/></svg></span>
          <span class="overlay-label" id="play-label">播放视频</span>
        </button>
      </div>
      <div class="bar"><span id="hint">可横屏或全屏观看</span><button class="action" id="fullscreen" type="button" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4"/></svg>全屏观看</button></div>
      <p class="notice" id="notice" role="status" hidden>暂时无法播放。请检查网络后重试，或<a href="video-720p.mp4">直接打开视频</a>。</p>
    </section>
    <footer>10月30日 · 视频记录</footer>
  </main>
  <script>
    const video=document.getElementById('video');
    const play=document.getElementById('play');
    const label=document.getElementById('play-label');
    const notice=document.getElementById('notice');
    const fullscreen=document.getElementById('fullscreen');
    play.hidden=false;video.controls=false;
    play.addEventListener('click',async()=>{notice.hidden=true;try{await video.play()}catch(error){notice.hidden=false;play.hidden=true;video.controls=true}});
    video.addEventListener('play',()=>{play.hidden=true;notice.hidden=true;video.controls=true});
    video.addEventListener('ended',()=>{play.hidden=false;video.controls=false;label.textContent='再看一遍';play.setAttribute('aria-label','重新播放视频')});
    video.addEventListener('error',()=>{notice.hidden=false;play.hidden=true;video.controls=true});
    video.querySelector('source').addEventListener('error',()=>{notice.hidden=false;play.hidden=true;video.controls=true});
    if(video.requestFullscreen||video.webkitEnterFullscreen){fullscreen.hidden=false;fullscreen.addEventListener('click',async()=>{try{if(video.webkitEnterFullscreen){video.webkitEnterFullscreen()}else{await video.requestFullscreen()}}catch(error){document.getElementById('hint').textContent='请使用播放器内的全屏按钮'}})}
  </script>
</body>
</html>
