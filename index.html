<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111316">
  <meta name="description" content="视频播放页面">
  <title>视频播放</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111316'/%3E%3Cpath d='M25 18v28l23-14z' fill='%23d8e8ce'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:dark;--bg:#111316;--text:#f3f3ee;--accent:#d8e8ce;--notice:#f0cdb5}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:18px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
    .watch{width:min(1080px,100%)}
    .playback-note{margin:0 0 14px;text-align:center;font-size:14px;line-height:1.6}
    .player{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#000;border:1px solid #ffffff16;border-radius:12px;box-shadow:0 18px 70px #0006}
    video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
    .overlay{position:absolute;inset:0;display:grid;place-items:center;background:#0003;border:0;color:#fff;cursor:pointer;font:inherit;text-shadow:0 1px 12px #000}
    .play-content{display:grid;justify-items:center;gap:12px}
    .play-circle{display:grid;place-items:center;width:76px;height:76px;border:1px solid #ffffff80;border-radius:50%;background:#1b241acc;backdrop-filter:blur(10px);transition:transform .2s,background .2s}
    .overlay:hover .play-circle{transform:scale(1.06);background:#33432dcc}
    .overlay svg{width:26px;height:26px;margin-left:4px;fill:currentColor}
    .overlay-label{font-size:14px;letter-spacing:.08em}
    .overlay[hidden],.notice[hidden]{display:none}
    .notice{position:absolute;right:16px;bottom:16px;left:16px;margin:0;padding:12px 14px;color:var(--notice);background:#111316e8;border:1px solid #ffffff20;border-radius:6px;font-size:13px;line-height:1.6;text-align:center}
    .notice a{color:var(--accent)}
    button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
    @media(max-width:600px){body{padding:10px}.player{border-radius:8px}.play-circle{width:60px;height:60px}.overlay-label{font-size:12px}.notice{right:9px;bottom:9px;left:9px;padding:10px 11px;font-size:12px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="watch" aria-label="视频播放器">
    <p class="playback-note">正片请跳转至0：35</p>
    <div class="player">
      <video id="video" controls playsinline preload="metadata" poster="poster.jpg" aria-label="视频">
        <source src="video-720p.mp4" type="video/mp4">
        你的浏览器不支持视频播放。<a href="video-720p.mp4">打开视频文件</a>
      </video>
      <button type="button" class="overlay" id="play" aria-label="播放视频" hidden>
        <span class="play-content">
          <span class="play-circle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.8c0-.8.9-1.3 1.6-.9l14 8.2a1 1 0 0 1 0 1.8l-14 8.2c-.7.4-1.6-.1-1.6-.9z"/></svg></span>
          <span class="overlay-label">播放视频</span>
        </span>
      </button>
      <p class="notice" id="notice" role="status" hidden>暂时无法播放，请检查网络后重试，或<a href="video-720p.mp4">直接打开视频</a>。</p>
    </div>
  </main>
  <script>
    const video=document.getElementById('video');
    const play=document.getElementById('play');
    const notice=document.getElementById('notice');
    play.hidden=false;video.controls=false;
    play.addEventListener('click',async()=>{notice.hidden=true;try{await video.play()}catch(error){notice.hidden=false;play.hidden=true;video.controls=true}});
    video.addEventListener('play',()=>{play.hidden=true;notice.hidden=true;video.controls=true});
    video.addEventListener('ended',()=>{play.hidden=false;video.controls=false});
    video.addEventListener('error',()=>{notice.hidden=false;play.hidden=true;video.controls=true});
    video.querySelector('source').addEventListener('error',()=>{notice.hidden=false;play.hidden=true;video.controls=true});
  </script>
</body>
</html>
